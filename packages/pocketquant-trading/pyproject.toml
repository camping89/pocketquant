[project]
name = "pocketquant-trading"
version = "2.0.0"
description = "PocketQuant live trading, OKX broker, and strategy orchestration"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pocketquant-core",
    "python-okx>=0.4.1",
    "websockets>=12.0",
]

[tool.uv.sources]
pocketquant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketquant"]
