[project]
name = "pocketquant-backtest"
version = "2.0.0"
description = "PocketQuant backtesting engine and optimization"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pocketquant-core",
    "pocketquant-infrastructure",
    "pocketquant-execution",
    "numpy>=1.26.0",
    "pandas>=2.1.0",
]

[tool.uv.sources]
pocketquant-core = { workspace = true }
pocketquant-infrastructure = { workspace = true }
pocketquant-execution = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketquant"]
