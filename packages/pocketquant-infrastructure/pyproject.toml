[project]
name = "pocketquant-infrastructure"
version = "2.0.0"
description = "PocketQuant persistence and concrete adapters (Mongo, Redis, APScheduler, brokers, HTTP)"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pocketquant-core",
    "pymongo>=4.16.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "cachetools>=5.0.0",
]

[tool.uv.sources]
pocketquant-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketquant"]
