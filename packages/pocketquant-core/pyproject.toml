[project]
name = "pocketquant-core"
version = "2.0.0"
description = "PocketQuant core domain, common utilities, and persistence"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pymongo>=4.16.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "websockets>=12.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "httpx>=0.26.0",
    "rich>=13.0.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src/pocketquant"]
