[project]
name = "pocketquant-app"
version = "2.0.0"
description = "PocketQuant FastAPI server — composition root"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pocketquant-core",
    "pocketquant-infrastructure",
    "pocketquant-execution",
    "pocketquant-backtest",
    "pocketquant-trading",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "dishka>=1.9.1",
]

[tool.uv.sources]
pocketquant-core = { workspace = true }
pocketquant-infrastructure = { workspace = true }
pocketquant-execution = { workspace = true }
pocketquant-backtest = { workspace = true }
pocketquant-trading = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketquant"]

[project.scripts]
pocketquant = "pocketquant.app.main:run"
