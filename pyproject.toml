[project]
name = "pocketquant"
version = "2.0.0"
description = "PocketQuant — algorithmic trading platform: domain core, shared engine, backtest, live trading, headless app runtime, FE gateway"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "PocketQuant Team" }]
dependencies = [
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    "pyyaml>=6.0",
    "structlog>=24.1.0",
    "rich>=13.0.0",
    "pymongo>=4.16.0",
    "redis>=5.0.0",
    "apscheduler>=3.10.0",
    "websockets>=12.0",
    "httpx>=0.26.0",
    "cachetools>=5.0.0",
    "python-okx>=0.4.1",
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "dishka>=1.9.1",
]

[project.scripts]
pocketquant = "pocketquant.app.main:run"

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
    "import-linter>=2.11",
    "testcontainers[mongodb,redis]>=4.8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pocketquant"]

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "TID"]
ignore = ["UP046"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"bson".msg = "Use pocketquant.core.common.uuid (UUID7) — ObjectId is banned"
"bson.ObjectId".msg = "Use pocketquant.core.common.uuid (UUID7) — ObjectId is banned"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# importlib mode lets duplicate test-package names (e.g. tests/unit/) coexist
# across all test trees without ModuleNotFoundError or ImportPathMismatchError.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require network)",
]

[tool.importlinter]
root_packages = ["pocketquant"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture — app top tier"
type = "layers"
layers = [
    "pocketquant.app",
    "pocketquant.backtest",
    "pocketquant.engine",
    "pocketquant.core",
]

[[tool.importlinter.contracts]]
name = "Core domain stays free of infra adapters"
type = "forbidden"
source_modules = ["pocketquant.core.domain"]
forbidden_modules = ["pocketquant.core.infra"]

[[tool.importlinter.contracts]]
name = "Core imports no inner package"
type = "forbidden"
source_modules = ["pocketquant.core"]
forbidden_modules = [
    "pocketquant.engine",
    "pocketquant.backtest",
    "pocketquant.app",
]

[[tool.importlinter.contracts]]
name = "Engine imports no sibling/upper package"
type = "forbidden"
source_modules = ["pocketquant.engine"]
forbidden_modules = [
    "pocketquant.backtest",
    "pocketquant.app",
]

[[tool.importlinter.contracts]]
name = "Backtest imports no upper package"
type = "forbidden"
source_modules = ["pocketquant.backtest"]
forbidden_modules = ["pocketquant.app"]

[[tool.importlinter.contracts]]
name = "fastapi only in app"
type = "forbidden"
source_modules = [
    "pocketquant.core",
    "pocketquant.engine",
    "pocketquant.backtest",
]
# import-linter rejects external subpackages, so dishka.integrations.fastapi
# can't be listed here; tests/baseline/test_package_layout_contract.py greps
# for it instead.
forbidden_modules = ["fastapi"]

[[tool.importlinter.contracts]]
name = "No bson/ObjectId usage — UUID7 only"
type = "forbidden"
source_modules = ["pocketquant"]
forbidden_modules = ["bson"]
