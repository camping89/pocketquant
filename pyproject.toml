[project]
name = "pocketquant-workspace"
version = "0.1.0"
description = "PocketQuant monorepo workspace"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "PocketQuant Team" }]

[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pocketquant-api",
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
    "import-linter>=2.11",
]

[tool.uv.sources]
pocketquant-api = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["UP046"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = [
    "packages/pocketquant-core/tests",
    "packages/pocketquant-backtest/tests",
    "packages/pocketquant-trading/tests",
    "packages/pocketquant-api/tests",
]
markers = [
    "integration: marks tests as integration tests (require network)",
]

[tool.importlinter]
root_packages = ["pocketquant"]

[[tool.importlinter.contracts]]
name = "Core has zero sibling dependencies"
type = "forbidden"
source_modules = ["pocketquant.core"]
forbidden_modules = ["pocketquant.backtest", "pocketquant.trading", "pocketquant.api"]

[[tool.importlinter.contracts]]
name = "Backtest depends only on Core"
type = "forbidden"
source_modules = ["pocketquant.backtest"]
forbidden_modules = ["pocketquant.trading", "pocketquant.api"]

[[tool.importlinter.contracts]]
name = "Trading depends only on Core"
type = "forbidden"
source_modules = ["pocketquant.trading"]
forbidden_modules = ["pocketquant.backtest", "pocketquant.api"]
