[project]
name = "pocketquant"
version = "0.1.0"
description = "Algorithmic trading platform with backtesting and forward testing capabilities"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "PocketQuant Team" }]

dependencies = [
    # Web Framework
    "fastapi>=0.109.0",
    "uvicorn[standard]>=0.27.0",
    "pydantic>=2.5.0",
    "pydantic-settings>=2.1.0",
    # Database
    "pymongo>=4.16.0",        # MongoDB driver (native async API)
    # Cache
    "redis>=5.0.0",
    # Background Jobs
    "apscheduler>=3.10.0",    # For scheduled jobs
    # Data Providers
    "tvdatafeed @ git+https://github.com/rongardF/tvdatafeed.git",  # TradingView historical data
    "websockets>=12.0",       # WebSocket client for real-time quotes
    "pandas>=2.1.0",
    "numpy>=1.26.0",
    # Brokers
    "python-okx>=0.4.1",      # OKX exchange API
    "pyyaml>=6.0",            # YAML strategy configs
    # Logging
    "structlog>=24.1.0",      # Structured logging
    # Utils
    "httpx>=0.26.0",          # Async HTTP client
    "rich>=13.0.0",           # Rich console output for error messages
    "dishka>=1.9.1",          # FastAPI integration included in base package
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
target-version = "py314"
line-length = 100
select = ["E", "F", "I", "N", "W", "UP"]

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require network)",
]
