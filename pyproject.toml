[project]
name = "pocketquant-workspace"
version = "0.1.0"
description = "PocketQuant monorepo workspace"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
authors = [{ name = "PocketQuant Team" }]
dependencies = [
    "pocketquant-app",
    "pocketquant-bff",
]

[tool.uv.workspace]
members = ["packages/*"]
exclude = ["packages/pocketquant-web"]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
    "ruff>=0.1.0",
    "pyright>=1.1.350",
    "pre-commit>=3.6.0",
    "import-linter>=2.11",
    "testcontainers[mongodb,redis]>=4.8.0",
]

[tool.uv.sources]
pocketquant-app = { workspace = true }
pocketquant-bff = { workspace = true }

[tool.ruff]
target-version = "py314"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "TID"]
ignore = ["UP046"]

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"bson".msg = "Use pocketquant.core.common.uuid (UUID7) — ObjectId is banned"
"bson.ObjectId".msg = "Use pocketquant.core.common.uuid (UUID7) — ObjectId is banned"

[tool.pyright]
pythonVersion = "3.14"
typeCheckingMode = "standard"

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
# importlib mode lets duplicate test-package names (e.g. tests/unit/) coexist
# across all four packages without ModuleNotFoundError or ImportPathMismatchError.
addopts = "--import-mode=importlib"
testpaths = ["tests"]
markers = [
    "integration: marks tests as integration tests (require network)",
]

[tool.importlinter]
root_packages = ["pocketquant"]
include_external_packages = true

[[tool.importlinter.contracts]]
name = "Layered architecture — app/bff top tier"
type = "layers"
layers = [
    "pocketquant.app | pocketquant.bff",
    "pocketquant.backtest | pocketquant.trading",
    "pocketquant.execution",
    "pocketquant.core",
]

[[tool.importlinter.contracts]]
name = "Core imports no inner package"
type = "forbidden"
source_modules = ["pocketquant.core"]
forbidden_modules = [
    "pocketquant.execution",
    "pocketquant.backtest",
    "pocketquant.trading",
    "pocketquant.app",
    "pocketquant.bff",
]

[[tool.importlinter.contracts]]
name = "Execution imports no sibling/upper package"
type = "forbidden"
source_modules = ["pocketquant.execution"]
forbidden_modules = [
    "pocketquant.backtest",
    "pocketquant.trading",
    "pocketquant.app",
    "pocketquant.bff",
]

[[tool.importlinter.contracts]]
name = "Backtest and Trading are independent siblings"
type = "forbidden"
source_modules = ["pocketquant.backtest"]
forbidden_modules = ["pocketquant.trading", "pocketquant.app", "pocketquant.bff"]

[[tool.importlinter.contracts]]
name = "Trading does not import Backtest"
type = "forbidden"
source_modules = ["pocketquant.trading"]
forbidden_modules = ["pocketquant.backtest", "pocketquant.app", "pocketquant.bff"]

[[tool.importlinter.contracts]]
name = "bff does not import app"
type = "forbidden"
source_modules = ["pocketquant.bff"]
forbidden_modules = ["pocketquant.app"]

[[tool.importlinter.contracts]]
name = "app does not import bff"
type = "forbidden"
source_modules = ["pocketquant.app"]
forbidden_modules = ["pocketquant.bff"]

[[tool.importlinter.contracts]]
name = "No bson/ObjectId usage — UUID7 only"
type = "forbidden"
source_modules = ["pocketquant"]
forbidden_modules = ["bson"]
