name: pocketquant

services:
  mongodb:
    image: mongo:7.0
    container_name: pocketquant-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT:-52017}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: pocketquant
      MONGO_INITDB_ROOT_PASSWORD: pocketquant_dev
      MONGO_INITDB_DATABASE: pocketquant
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--username", "pocketquant", "--password", "pocketquant_dev", "--authenticationDatabase", "admin", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: pocketquant-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-53679}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Optional: MongoDB admin UI
  mongo-express:
    image: mongo-express:1.0.2
    container_name: pocketquant-mongo-express
    restart: unless-stopped
    ports:
      - "${MONGOEXPRESS_PORT:-58081}:8081"
    environment:
      ME_CONFIG_MONGODB_ADMINUSERNAME: pocketquant
      ME_CONFIG_MONGODB_ADMINPASSWORD: pocketquant_dev
      ME_CONFIG_MONGODB_URL: mongodb://pocketquant:pocketquant_dev@mongodb:27017/
      ME_CONFIG_BASICAUTH: "false"
    depends_on:
      mongodb:
        condition: service_healthy
    profiles:
      - admin

volumes:
  mongodb_data:
  redis_data:
