name: pocketquant-prod

services:
  web:
    image: ${DOCKERHUB_USERNAME}/pocketquant-web:${IMAGE_TAG:-latest}
    container_name: pocketquant-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  app:
    image: ${DOCKERHUB_USERNAME}/pocketquant:${IMAGE_TAG:-latest}
    container_name: pocketquant-app
    restart: unless-stopped
    ports:
      - "${APP_PORT}:41920"
    environment:
      - APP_NAME=PocketQuant
      - APP_VERSION=0.1.0
      - ENVIRONMENT=production
      - DEBUG=false
      - MONGODB_URL=mongodb://${MONGO_USER:-pocketquant}:${MONGO_PASSWORD}@mongodb:27017/pocketquant?authSource=admin
      - MONGODB_DATABASE=pocketquant
      - MONGODB_MIN_POOL_SIZE=5
      - MONGODB_MAX_POOL_SIZE=50
      - REDIS_URL=redis://redis:6379/0
      - REDIS_CACHE_TTL=3600
      - TRADINGVIEW_USERNAME=${TRADINGVIEW_USERNAME:-}
      - TRADINGVIEW_PASSWORD=${TRADINGVIEW_PASSWORD:-}
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - ENABLE_JOBS=${ENABLE_JOBS:-true}
      - DEFAULT_BROKER=${DEFAULT_BROKER:-paper}
      - PAPER_INITIAL_BALANCE=${PAPER_INITIAL_BALANCE:-100000}
      - PAPER_SLIPPAGE_PERCENT=${PAPER_SLIPPAGE_PERCENT:-0.001}
      - OKX_API_KEY=${OKX_API_KEY:-}
      - OKX_API_SECRET=${OKX_API_SECRET:-}
      - OKX_PASSPHRASE=${OKX_PASSPHRASE:-}
      - OKX_DEMO_MODE=${OKX_DEMO_MODE:-true}
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:41920/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:7.0
    container_name: pocketquant-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pocketquant}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: pocketquant
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: pocketquant-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  portainer:
    image: portainer/portainer-ce:latest
    container_name: pocketquant-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

volumes:
  mongodb_data:
  redis_data:
  portainer_data:
