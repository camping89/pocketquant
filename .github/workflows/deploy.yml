name: Deploy to Production

on:
  push:
    branches:
      - master
  workflow_dispatch:
    inputs:
      profile:
        description: 'Compose profiles to enable'
        required: false
        default: 'monitoring,admin'
        type: choice
        options:
          - ''
          - 'monitoring'
          - 'admin'
          - 'monitoring,admin'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  APP_PORT: 41920
  DEPLOY_HOST: ${{ vars.DEPLOY_HOST }}
  DEPLOY_SSH_PORT: ${{ vars.DEPLOY_SSH_PORT }}
  DEPLOY_USER: ${{ vars.DEPLOY_USER }}

jobs:
  build:
    name: Build & Push Image
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image_tag: ${{ steps.meta.outputs.tags }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to Server
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare server environment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            echo "=== Checking server environment ==="

            # Check Docker
            if ! command -v docker &> /dev/null; then
              echo "Installing Docker..."
              curl -fsSL https://get.docker.com | sh
              sudo usermod -aG docker $USER
            else
              echo "Docker: $(docker --version)"
            fi

            # Check Docker Compose plugin
            if ! docker compose version &> /dev/null; then
              echo "Installing Docker Compose plugin..."
              sudo apt-get update
              sudo apt-get install -y docker-compose-plugin
            else
              echo "Docker Compose: $(docker compose version)"
            fi

            # Ensure app directory exists
            mkdir -p /opt/pocketquant/docker

            echo "=== Environment ready ==="

      - name: Sync docker configs
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "docker/compose.prod.yml,docker/Caddyfile,docker/mongo-init.js,docker/grafana-datasources.yml,docker/loki-config.yml,docker/promtail-config.yml"
          target: "/opt/pocketquant/"
          strip_components: 0

      - name: Create .env from secrets
        uses: appleboy/ssh-action@v1.0.3
        env:
          MONGO_PASSWORD: ${{ secrets.MONGO_PASSWORD }}
          MONGO_EXPRESS_PASSWORD: ${{ secrets.MONGO_EXPRESS_PASSWORD }}
          GRAFANA_PASSWORD: ${{ secrets.GRAFANA_PASSWORD }}
          TRADINGVIEW_USERNAME: ${{ secrets.TRADINGVIEW_USERNAME }}
          TRADINGVIEW_PASSWORD: ${{ secrets.TRADINGVIEW_PASSWORD }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: MONGO_PASSWORD,MONGO_EXPRESS_PASSWORD,GRAFANA_PASSWORD,TRADINGVIEW_USERNAME,TRADINGVIEW_PASSWORD
          script: |
            cat > /opt/pocketquant/docker/.env << EOF
            GITHUB_USER=${{ github.actor }}
            IMAGE_TAG=latest
            CADDY_HTTP_PORT=51080
            CADDY_HTTPS_PORT=51443
            MONGO_USER=pocketquant
            MONGO_PASSWORD=${MONGO_PASSWORD}
            MONGO_EXPRESS_USER=admin
            MONGO_EXPRESS_PASSWORD=${MONGO_EXPRESS_PASSWORD}
            GRAFANA_USER=admin
            GRAFANA_PASSWORD=${GRAFANA_PASSWORD}
            GRAFANA_ROOT_URL=http://${{ env.DEPLOY_HOST }}:51080/grafana
            TRADINGVIEW_USERNAME=${TRADINGVIEW_USERNAME}
            TRADINGVIEW_PASSWORD=${TRADINGVIEW_PASSWORD}
            ENABLE_JOBS=${{ vars.ENABLE_JOBS || 'true' }}
            EOF
            echo "=== .env created ==="

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
          GITHUB_USER: ${{ github.actor }}
          IMAGE_FULL: ghcr.io/${{ github.repository }}
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: GHCR_TOKEN,GITHUB_USER,IMAGE_FULL
          script: |
            set -e

            echo "=== Deploying PocketQuant ==="
            cd /opt/pocketquant

            # Login to GHCR using PAT (not GITHUB_TOKEN)
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GITHUB_USER" --password-stdin

            # Pull latest image
            docker pull "$IMAGE_FULL:latest"

            # Determine profiles
            PROFILES="${{ github.event.inputs.profile || 'monitoring,admin' }}"
            PROFILE_FLAGS=""
            if [ -n "$PROFILES" ]; then
              for p in $(echo $PROFILES | tr ',' ' '); do
                PROFILE_FLAGS="$PROFILE_FLAGS --profile $p"
              done
            fi

            # Start all services (app, caddy, plus profile services like monitoring/admin)
            docker compose -f docker/compose.prod.yml --env-file docker/.env $PROFILE_FLAGS up -d

            # Wait for container to be healthy (up to 90s)
            echo "Waiting for app container to become healthy..."
            for i in {1..18}; do
              STATUS=$(docker inspect --format='{{.State.Health.Status}}' pocketquant-app 2>/dev/null || echo "not_found")
              echo "  Attempt $i/18: $STATUS"
              if [ "$STATUS" = "healthy" ]; then
                echo "Container is healthy!"
                break
              fi
              if [ "$STATUS" = "unhealthy" ]; then
                echo "Container became unhealthy, checking logs..."
                docker logs pocketquant-app --tail 30
                exit 1
              fi
              sleep 5
            done

            # Final health verification
            if [ "$STATUS" != "healthy" ]; then
              echo "Container failed to become healthy within timeout"
              docker logs pocketquant-app --tail 50
              exit 1
            fi

            echo "=== Deployment successful ==="

      - name: Verify deployment
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Container Status ==="
            docker ps --format "table {{.Names}}\t{{.Status}}\t{{.Ports}}" | grep pocketquant

            echo ""
            echo "=== Health Check ==="
            docker exec pocketquant-app curl -s http://localhost:41920/health | python3 -m json.tool || true

            echo ""
            echo "=== Recent App Logs ==="
            docker logs pocketquant-app --tail 10 2>&1 || true

  cleanup:
    name: Cleanup Old Images
    needs: deploy
    runs-on: ubuntu-latest

    steps:
      - name: Cleanup on server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ env.DEPLOY_HOST }}
          port: ${{ env.DEPLOY_SSH_PORT }}
          username: ${{ env.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            echo "=== Cleaning up old images ==="
            # Remove dangling images
            docker image prune -f

            # Remove images older than 7 days
            docker image prune -af --filter "until=168h" || true

            echo "=== Disk usage ==="
            df -h /
