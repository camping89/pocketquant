name: CI

on:
  push:
    branches: [master, develop]
  workflow_dispatch:

env:
  DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.DOCKERHUB_USERNAME }}/pocketquant
          tags: |
            type=raw,value=latest
            type=sha,prefix=sha-,format=short

      - uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify pushed images
        run: |
          echo "=== Docker Hub Push Summary ==="
          echo "Repository: ${{ env.DOCKERHUB_USERNAME }}/pocketquant"
          echo "Tags pushed:"
          echo "${{ steps.meta.outputs.tags }}" | tr ',' '\n' | sed 's/^/  - /'
          echo ""
          echo "Verify at: https://hub.docker.com/r/${{ env.DOCKERHUB_USERNAME }}/pocketquant/tags"

      - name: Prune old Docker Hub tags (keep latest 7)
        run: |
          TOKEN=$(curl -s -H "Content-Type: application/json" \
            -X POST -d "{\"username\":\"${{ env.DOCKERHUB_USERNAME }}\",\"password\":\"${{ secrets.DOCKERHUB_TOKEN }}\"}" \
            https://hub.docker.com/v2/users/login/ | jq -r .token)

          if [ "$TOKEN" = "null" ] || [ -z "$TOKEN" ]; then
            echo "Warning: Could not authenticate for tag cleanup. Ensure DOCKERHUB_TOKEN has delete scope."
            exit 0
          fi

          curl -s -H "Authorization: JWT $TOKEN" \
            "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_USERNAME }}/pocketquant/tags/?page_size=100&ordering=-last_updated" \
            | jq -r '.results[] | select(.name | startswith("sha-")) | .name' \
            | tail -n +8 \
            | while read tag; do
                curl -s -X DELETE -H "Authorization: JWT $TOKEN" \
                  "https://hub.docker.com/v2/repositories/${{ env.DOCKERHUB_USERNAME }}/pocketquant/tags/$tag/"
                echo "Deleted: $tag"
              done

          echo "Tag cleanup complete. Kept: latest + 7 most recent sha-* tags."
