name: pocketquant-prod

services:
  web:
    image: ${DOCKERHUB_USERNAME}/pocketquant-web:${IMAGE_TAG:-latest}
    container_name: pocketquant-web
    restart: unless-stopped
    ports:
      - "${WEB_PORT:-80}:80"
    # nginx proxies /api → app (the single backend). Wait for app readiness so
    # the SPA never hits a dead upstream on first paint.
    depends_on:
      app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:80"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 5s
    logging:
      driver: json-file
      options:
        max-size: "5m"
        max-file: "3"

  # Single backend: full trading runtime (scheduler, WS feed, strategy
  # lifecycle, reconcile loop, backtest worker) + all API routes + SPA
  # serving. No published host port — only nginx reaches it on the compose
  # network. Migrations + ensure_indexes run in lifespan BEFORE yield, so the
  # container is only healthy after schema is ready.
  app:
    image: ${DOCKERHUB_USERNAME}/pocketquant:${IMAGE_TAG:-latest}
    container_name: pocketquant-app
    restart: unless-stopped
    # Single worker only — scheduler/WS feed/broker are in-process singletons;
    # --workers N would duplicate the reconcile loop and live broker connection.
    command: ["uvicorn", "pocketquant.app.main:app", "--host", "0.0.0.0", "--port", "41921"]
    # Single source of truth: every app setting comes from .env (the file
    # materialized on the VPS from pocketquant-config/vps/default/.env each
    # deploy). MONGODB_URL/REDIS_URL in that file use the internal docker
    # service names (mongodb, redis), which resolve on this compose network.
    env_file:
      - .env
    depends_on:
      mongodb:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:41921/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  mongodb:
    image: mongo:7.0
    container_name: pocketquant-mongodb
    restart: unless-stopped
    ports:
      - "${MONGO_PORT}:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_USER:-pocketquant}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD}
      MONGO_INITDB_DATABASE: pocketquant
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7.2-alpine
    container_name: pocketquant-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT}:6379"
    command: redis-server --appendonly yes --maxmemory 100mb --maxmemory-policy allkeys-lru --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "--no-auth-warning", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  portainer:
    image: portainer/portainer-ce:latest
    container_name: pocketquant-portainer
    restart: unless-stopped
    ports:
      - "${PORTAINER_PORT}:9000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - portainer_data:/data

volumes:
  mongodb_data:
  redis_data:
  portainer_data:
